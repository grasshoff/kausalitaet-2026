<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" font-family="'Source Sans 3', 'Source Sans Pro', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a3a5c"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
    </marker>
  </defs>

  <!-- ============ Premisses row ============ -->
  <text x="20" y="26" font-size="13" font-weight="bold" fill="#1a3a5c">PREMISSES</text>

  <!-- P1 evidence -->
  <rect x="20" y="40" width="160" height="92" rx="8" fill="#f4f1ea" stroke="#1a3a5c" stroke-width="1.4"/>
  <text x="100" y="60" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1a3a5c">(P1) Evidence</text>
  <text x="100" y="78" font-size="11.5" text-anchor="middle" fill="#333333">coincidence table &#948;</text>
  <text x="100" y="93" font-size="11.5" text-anchor="middle" fill="#333333">over factor set <tspan font-style="italic" font-family="Charter, 'Source Serif 4', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif">F</tspan></text>
  <text x="100" y="108" font-size="11.5" text-anchor="middle" fill="#333333">(observed test</text>
  <text x="100" y="123" font-size="11.5" text-anchor="middle" fill="#333333">situations)</text>

  <!-- P2 HC -->
  <rect x="206" y="40" width="160" height="92" rx="8" fill="#f4f1ea" stroke="#1a3a5c" stroke-width="1.4"/>
  <text x="286" y="60" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1a3a5c">(P2) Homogeneity HC</text>
  <text x="286" y="78" font-size="11.5" text-anchor="middle" fill="#333333">each latent bundle keeps</text>
  <text x="286" y="93" font-size="11.5" text-anchor="middle" fill="#333333">one truth-value</text>
  <text x="286" y="108" font-size="11.5" text-anchor="middle" fill="#333333">across &#948; (falsified by a</text>
  <text x="286" y="123" font-size="11.5" text-anchor="middle" fill="#333333">contradictory configuration)</text>

  <!-- P3 PD -->
  <rect x="392" y="40" width="160" height="92" rx="8" fill="#f4f1ea" stroke="#1a3a5c" stroke-width="1.4"/>
  <text x="472" y="60" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1a3a5c">(P3) Determination PD</text>
  <text x="472" y="78" font-size="11.5" text-anchor="middle" fill="#333333">every instantiation of E</text>
  <text x="472" y="93" font-size="11.5" text-anchor="middle" fill="#333333">is brought about by an</text>
  <text x="472" y="108" font-size="11.5" text-anchor="middle" fill="#333333">instantiated sufficient</text>
  <text x="472" y="123" font-size="11.5" text-anchor="middle" fill="#333333">condition</text>

  <!-- P4 CU -->
  <rect x="578" y="40" width="160" height="92" rx="8" fill="#f4f1ea" stroke="#1a3a5c" stroke-width="1.4"/>
  <text x="658" y="60" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1a3a5c">(P4) Uniqueness CU</text>
  <text x="658" y="78" font-size="11.5" text-anchor="middle" fill="#333333">one complete mosaic &#8594;</text>
  <text x="658" y="93" font-size="11.5" text-anchor="middle" fill="#333333">one determinate causal</text>
  <text x="658" y="108" font-size="11.5" text-anchor="middle" fill="#333333">structure (ambiguity is</text>
  <text x="658" y="123" font-size="11.5" text-anchor="middle" fill="#333333">evidential, not ontic)</text>

  <!-- inductive risk annotation -->
  <rect x="206" y="152" width="346" height="34" rx="6" fill="none" stroke="#c62828" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="379" y="166" font-size="11.5" text-anchor="middle" fill="#c62828">inductive risk lives here &#8212; and only here:</text>
  <text x="379" y="180" font-size="11.5" text-anchor="middle" fill="#c62828">HC tested via contradictions; completeness secured diachronically (PERM); graded by the probabilistic cover</text>
  <line x1="286" y1="152" x2="286" y2="136" stroke="#c62828" stroke-width="1.1" marker-end="url(#arrr)"/>
  <line x1="472" y1="152" x2="472" y2="136" stroke="#c62828" stroke-width="1.1" marker-end="url(#arrr)"/>
  <line x1="230" y1="152" x2="140" y2="136" stroke="#c62828" stroke-width="1.1" marker-end="url(#arrr)"/>

  <!-- ============ arrows to rules ============ -->
  <line x1="379" y1="196" x2="379" y2="228" stroke="#1a3a5c" stroke-width="2" marker-end="url(#arrd)"/>
  <text x="392" y="218" font-size="12" fill="#1a3a5c" font-style="italic">deductively valid derivation</text>

  <!-- ============ Rule calculus ============ -->
  <rect x="140" y="232" width="480" height="164" rx="10" fill="#ffffff" stroke="#1a3a5c" stroke-width="1.8"/>
  <text x="380" y="254" font-size="13" text-anchor="middle" font-weight="bold" fill="#1a3a5c">RULE CALCULUS (causal principles of the model)</text>
  <g font-size="11.5" fill="#333333">
    <text x="165" y="276">(SUF)&#8195;&#8194;read sufficiency off &#948;: no row has &#931; without E</text>
    <text x="165" y="294">(MS)&#8195;&#8195;minimise conjunctions &#8594; minimally sufficient conditions</text>
    <text x="165" y="312">(NEC)&#8195;&#8194;form the disjunction of all MSCs: necessary for E</text>
    <text x="165" y="330">(MN)&#8195;&#8195;minimise the disjunction &#8594; minimal necessity</text>
    <text x="165" y="348">(CPLX)&#8195;orient by the asymmetry of determination (k &#8805; 2)</text>
    <text x="165" y="366">(PERM)&#8194;retain only what survives factor-set expansion</text>
  </g>
  <text x="380" y="386" font-size="11" text-anchor="middle" fill="#5a6672">each rule is a licence with applicability conditions checkable on &#948;&#8194;(companion: models.qmd)</text>

  <!-- ============ arrow to minimal theory ============ -->
  <line x1="379" y1="396" x2="379" y2="424" stroke="#1a3a5c" stroke-width="2" marker-end="url(#arrd)"/>

  <!-- ============ Minimal theory ============ -->
  <rect x="170" y="428" width="420" height="60" rx="10" fill="#eef2f0" stroke="#2e7d32" stroke-width="1.8"/>
  <text x="380" y="448" font-size="13" text-anchor="middle" font-weight="bold" fill="#2e7d32">DERIVED MINIMAL THEORY &#934;</text>
  <text x="380" y="472" font-size="15" text-anchor="middle" fill="#1a1a1a" font-family="Charter, 'Source Serif 4', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif" font-style="italic">SC * OX&#8194;+&#8194;FL * SP * OX&#8194;&#8658;&#8194;FI</text>

  <!-- ============ arrow to hypothesis ============ -->
  <line x1="379" y1="488" x2="379" y2="514" stroke="#1a3a5c" stroke-width="2" marker-end="url(#arrd)"/>
  <text x="392" y="506" font-size="12" fill="#1a3a5c" font-style="italic">definition of causal relevance</text>

  <!-- ============ Hypothesis verdict ============ -->
  <rect x="110" y="518" width="540" height="72" rx="10" fill="#f4f1ea" stroke="#8a7226" stroke-width="1.8"/>
  <text x="380" y="540" font-size="13" text-anchor="middle" font-weight="bold" fill="#8a7226">VALIDITY OF THE CAUSAL HYPOTHESIS H</text>
  <text x="380" y="560" font-size="12" text-anchor="middle" fill="#333333">&#8220;A is causally relevant to E&#8221; is valid&#8194;iff&#8194;A (or &#172;A) occurs as a non-redundant literal</text>
  <text x="380" y="576" font-size="12" text-anchor="middle" fill="#333333">in some minimally sufficient condition of &#934;&#8194;&#8212;&#8194;e.g. H: &#8220;SC causes FI&#8221; is valid via SC * OX</text>

  <text x="380" y="614" font-size="11.5" text-anchor="middle" fill="#5a6672">Baumgartner &#38; Gra&#223;hoff (2004); Gra&#223;hoff &#38; May (2001): the step from premisses to hypothesis is deductive &#8212;</text>
  <text x="380" y="628" font-size="11.5" text-anchor="middle" fill="#5a6672">rejecting H rationally requires rejecting one of the premisses.</text>
</svg>
