<text x="22.0" y="178.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" fill="#5a6672" text-anchor="start" font-style="italic">TRT = treatment; SEV = severity; OUT = adverse outcome. The absence of OUT is the regularity's target.</text>
